<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <header class="site-header">
        <h1>Temperature Converter</h1>
        <p>Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>
    </header>

    <main class="container">
        <section class="converter-card">
            <h2>Enter Temperature</h2>

            <form id="converterForm">
                <label for="temperature">Temperature value</label>
                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter a number"
                    step="any"
                    required
                >

                <label for="unit">Convert from</label>
                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

                <button type="submit">Convert</button>
            </form>

            <p id="errorMessage" class="error-message" role="alert"></p>

            <section id="results" class="results" aria-live="polite" hidden>
                <h2>Converted Temperatures</h2>
                <div class="result-row">
                    <span>Celsius</span>
                    <strong id="celsiusResult">—</strong>
                </div>
                <div class="result-row">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">—</strong>
                </div>
                <div class="result-row">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">—</strong>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>Task 3 - Temperature Converter Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
